name: Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional release label for the uploaded artifact."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_UPDATER_ENDPOINT) {
            throw "TAURI_UPDATER_ENDPOINT repository variable is required for release updater artifacts."
          }
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY) {
            throw "TAURI_UPDATER_PUBLIC_KEY repository variable is required for release updater artifacts."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required because updater artifacts are enabled."
          }

      - name: Build Windows installers
        shell: pwsh
        run: |
          $tauriConfig = @{
            bundle = @{
              createUpdaterArtifacts = $true
            }
            plugins = @{
              updater = @{
                endpoints = @($env:TAURI_UPDATER_ENDPOINT)
                pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
                windows = @{
                  installMode = "passive"
                }
              }
            }
          } | ConvertTo-Json -Depth 8 -Compress

          pnpm --filter desktop exec tauri build --bundles nsis,msi --ci --config $tauriConfig

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lexora-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.zip
