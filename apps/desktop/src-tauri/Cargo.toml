[package]
name = "lexora"
version = "0.1.0"
description = "Lexora — Premium English-Vietnamese vocabulary learning platform"
authors = ["Kieran Lucas"]
license = "MIT"
edition = "2021"

[lib]
name = "lexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
