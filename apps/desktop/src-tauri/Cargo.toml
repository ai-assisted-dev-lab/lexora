[package]
name = "lexora"
version = "0.1.0"
description = "Lexora — Premium English-Vietnamese vocabulary learning platform"
authors = ["Kieran Lucas"]
license = "MIT"
edition = "2021"

[lib]
name = "lexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ── Features ─────────────────────────────────────────────────────────────────
#
# sqlcipher — Replaces the bundled vanilla SQLite with SQLCipher (AES-256 at
#             rest). Also bundles a vendored OpenSSL so no system libraries are
#             required. Activating this feature requires Perl and NASM on the
#             build machine (needed by OpenSSL's own configure step).
#
#             To enable: `cargo build --features sqlcipher`
#             In release CI: set LEXORA_SQLCIPHER=1 and pass --features sqlcipher
#
# Default build is unencrypted. All encryption plumbing is compiled and tested
# regardless; only the PRAGMA key application is gated on this feature.
[features]
default = []
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# Argon2id password hashing.  "std" enables OsRng for salt generation.
argon2 = { version = "0.5", features = ["std"] }
# OS-native credential store (Windows Credential Manager / macOS Keychain /
# Linux Secret Service). Used to persist the per-install DB encryption key.
keyring = "2"
# OS CSPRNG for key generation. Thin wrapper around platform primitives;
# no heavy C compilation required.
getrandom = "0.2"
# Base64 encoding for returning audio byte data over the Tauri IPC bridge.
base64 = "0.22"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
